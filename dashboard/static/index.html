<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/signal.css">
  <link rel="stylesheet" href="css/position.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header id="header">
    <div id="header-logo">algo<span>OS</span></div>
    <div id="header-sep" style="width:1px;height:18px;background:var(--border2);margin:0 4px;"></div>
    <div id="strategy-picker">
      <select id="strategy-select"></select>
    </div>
    <span class="badge-live">● LIVE</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
      <div id="header-pct" class="text-muted" style="font-size:13px;font-weight:500;"></div>
      <div id="header-pnl" style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;">—</div>
    </div>
  </header>

  <!-- Content -->
  <div id="content">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Overall</div>
        <div id="sidebar-overall">
          <div class="skeleton skeleton-line" style="width:100%;height:60px;margin-bottom:12px;border-radius:8px;"></div>
          <div class="skeleton skeleton-line" style="width:80%;"></div>
          <div class="skeleton skeleton-line" style="width:90%;"></div>
          <div class="skeleton skeleton-line" style="width:70%;"></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">By Month</div>
        <div id="sidebar-months">
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Legend</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--green-bg);border:1px solid var(--green-border);"></div> Winning session</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--red-bg);border:1px solid var(--red-border);"></div> Losing session</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent);"></div> Has leg detail</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--muted);"></div> Summary only</div>
      </div>
    </aside>

    <!-- Main area -->
    <main id="main">
      <div class="loading-state" id="main-loading">
        <div class="spinner"></div>
        <span>Loading strategy data…</span>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/strategy.js"></script>
<script src="js/positions.js"></script>
<script src="js/calendar.js"></script>
<script src="js/signal.js"></script>
<script src="js/trade.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
</body>
</html>
